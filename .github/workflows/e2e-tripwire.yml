name: E2E tripwire (reusable)

on:
  workflow_call:
    inputs:
      tripwire_ref:
        description: Branch, tag or SHA of this repo to take the tripwire scripts and prompt from.
        required: false
        type: string
        default: main
      e2e_ref:
        description: Branch, tag or SHA of passentry-e2e to check the diff against.
        required: false
        type: string
        default: main
    secrets:
      anthropic_api_key:
        required: true
      e2e_deploy_key:
        required: true

concurrency:
  group: tripwire-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tripwire:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: PassEntry/.github
          path: tripwire-src
          ref: ${{ inputs.tripwire_ref }}
          persist-credentials: false

      - id: config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { config } = await import(`${process.env.GITHUB_WORKSPACE}/tripwire-src/tripwire/tripwire.mjs`);
            await config({ github, context, core });

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ steps.config.outputs.e2e_repo }}
          path: e2e
          ref: ${{ inputs.e2e_ref }}
          ssh-key: ${{ secrets.e2e_deploy_key }}
          persist-credentials: false

      - id: comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { comment } = await import(`${process.env.GITHUB_WORKSPACE}/tripwire-src/tripwire/tripwire.mjs`);
            await comment({ github, context, core });

      - name: Wait for more pushes
        if: github.run_attempt == '1'
        run: sleep "$WAIT_SECONDS"
        env:
          WAIT_SECONDS: ${{ steps.config.outputs.wait_seconds }}

      - id: start
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { start } = await import(`${process.env.GITHUB_WORKSPACE}/tripwire-src/tripwire/tripwire.mjs`);
            await start({ github, context, core });
        env:
          COMMENT_ID: ${{ steps.comment.outputs.comment_id }}

      # Workaround for anthropics/claude-code-action#1901: the action's entrypoint markers get billing_error
      - name: Install Claude Code without action markers
        if: steps.start.outputs.skip != 'true'
        run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          printf '#!/bin/sh\nunset CLAUDE_CODE_ENTRYPOINT CLAUDE_CODE_ACTION\nexec "%s" "$@"\n' "$(npm prefix -g)/bin/claude" > "$RUNNER_TEMP/claude"
          chmod +x "$RUNNER_TEMP/claude"
        env:
          CLAUDE_CODE_VERSION: ${{ steps.config.outputs.claude_code_version }}

      - id: tripwire
        if: steps.start.outputs.skip != 'true'
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          path_to_claude_code_executable: ${{ runner.temp }}/claude
          github_token: ${{ github.token }}
          prompt: "Follow tripwire-src/tripwire/prompt.md. The diff is in ./diff.patch and the changed file list is in ./changed-files.txt."
          claude_args: |
            --model ${{ steps.config.outputs.model }}
            --effort ${{ steps.config.outputs.effort }}
            --max-turns ${{ steps.config.outputs.max_turns }}
            --allowedTools "${{ steps.config.outputs.allowed_tools }}"
            --disallowedTools "${{ steps.config.outputs.disallowed_tools }}"
            --json-schema '${{ steps.config.outputs.result_schema }}'

      - if: always() && steps.comment.outputs.comment_id != '' && steps.start.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { post } = await import(`${process.env.GITHUB_WORKSPACE}/tripwire-src/tripwire/tripwire.mjs`);
            await post({ github, context, core });
        env:
          COMMENT_ID: ${{ steps.comment.outputs.comment_id }}
          RESULT: ${{ steps.tripwire.outputs.structured_output }}
          JOB_STATUS: ${{ job.status }}
